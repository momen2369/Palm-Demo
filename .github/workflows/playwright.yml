name: Playwright Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PST_BASE_URL: ${{ secrets.PST_BASE_URL }}
      PST_ADMIN_EMAIL: ${{ secrets.PST_ADMIN_EMAIL }}
      PST_ADMIN_PASSWORD: ${{ secrets.PST_ADMIN_PASSWORD }}
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run all Playwright tests
        run: npx playwright test

      - name: Upload Playwright report and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30
