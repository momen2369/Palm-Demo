name: Playwright Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      project:
        description: Test project to run
        type: choice
        required: true
        default: all
        options:
          - all
          - chromium
          - firefox
          - webkit
          - api

permissions:
  contents: read
  pages: read

concurrency:
  group: playwright-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      report_exists: ${{ steps.report-check.outputs.exists }}
      pages_enabled: ${{ steps.pages-check.outputs.enabled }}
    env:
      PST_BASE_URL: ${{ secrets.PST_BASE_URL }}
      PST_ADMIN_EMAIL: ${{ secrets.PST_ADMIN_EMAIL }}
      PST_ADMIN_PASSWORD: ${{ secrets.PST_ADMIN_PASSWORD }}
      PST_API_BASE_URL: ${{ secrets.PST_API_BASE_URL }}
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        if: ${{ inputs.project != 'api' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ inputs.project }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-

      - name: Install Playwright browsers
        if: ${{ inputs.project != 'api' }}
        timeout-minutes: 15
        run: |
          if [[ "${{ inputs.project }}" == "all" ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps "${{ inputs.project }}"
          fi

      - name: Run all Playwright tests
        if: ${{ inputs.project == 'all' }}
        run: npx playwright test

      - name: Run selected Playwright project
        if: ${{ inputs.project != 'all' }}
        run: npx playwright test --project="${{ inputs.project }}"

      - name: Check for HTML report
        id: report-check
        if: ${{ always() }}
        run: |
          if [[ -f playwright-report/index.html ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether GitHub Pages is enabled
        id: pages-check
        if: ${{ always() && steps.report-check.outputs.exists == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', 'false');
            }

      - name: Upload Playwright HTML report
        if: ${{ always() && steps.report-check.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: ${{ !cancelled() && hashFiles('test-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

      - name: Explain Pages setup
        if: ${{ always() && steps.report-check.outputs.exists == 'true' && steps.pages-check.outputs.enabled == 'false' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
        run: |
          {
            echo "## GitHub Pages is not enabled"
            echo "The report is available as a downloadable artifact: [Download report artifact]($RUN_URL)."
            echo "To publish a directly viewable report link on future runs, go to **Settings → Pages** and set the build and deployment source to **GitHub Actions**."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-report:
    if: ${{ always() && needs.test.outputs.report_exists == 'true' && needs.test.outputs.pages_enabled == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: playwright-pages-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download Playwright HTML report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload report site
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - name: Deploy report site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add direct report link
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}?run=${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "## Playwright HTML report" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
