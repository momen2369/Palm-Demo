name: Playwright Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      project:
        description: Test project to run
        type: choice
        required: true
        default: all
        options:
          - all
          - chromium
          - firefox
          - webkit
          - api

permissions:
  contents: read

concurrency:
  group: playwright-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      report_exists: ${{ steps.report-check.outputs.exists }}
    env:
      PST_BASE_URL: ${{ secrets.PST_BASE_URL }}
      PST_ADMIN_EMAIL: ${{ secrets.PST_ADMIN_EMAIL }}
      PST_ADMIN_PASSWORD: ${{ secrets.PST_ADMIN_PASSWORD }}
      PST_API_BASE_URL: ${{ secrets.PST_API_BASE_URL }}
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run all Playwright tests
        if: ${{ inputs.project == 'all' }}
        run: npx playwright test

      - name: Run selected Playwright project
        if: ${{ inputs.project != 'all' }}
        run: npx playwright test --project="${{ inputs.project }}"

      - name: Check for HTML report
        id: report-check
        if: ${{ always() }}
        run: |
          if [[ -f playwright-report/index.html ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright HTML report
        if: ${{ always() && steps.report-check.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: ${{ !cancelled() && hashFiles('test-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

  publish-report:
    if: ${{ always() && needs.test.outputs.report_exists == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: playwright-pages-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download Playwright HTML report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload report site
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - name: Deploy report site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add direct report link
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## Playwright HTML report" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
